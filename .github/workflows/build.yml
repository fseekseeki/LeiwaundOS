name: Build LeiwaundOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: |
          pyinstaller --onefile --name LeiwaundOS src/leiwaund_app_v2.py --noconfirm || pyinstaller --onefile --name LeiwaundOS screenshot_tool.py --noconfirm
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: LeiwaundOS-${{ matrix.os }}
          path: dist/
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
