name: Build LeiwaundOS v2.0
on: [push]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install customtkinter pillow pyinstaller requests folium
      - run: pyinstaller --noconsole --onefile --icon=icon.ico --name=LeiwaundOS_v2.0_Windows main.py
      - uses: actions/upload-artifact@v4
        with:
          name: LeiwaundOS-Windows-v2.0
          path: dist/LeiwaundOS_v2.0_Windows.exe
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install customtkinter pillow pyinstaller requests folium
          sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pyinstaller --noconsole --onefile --icon=icon.png --name=LeiwaundOS_v2.0_Linux main.py
      - uses: actions/upload-artifact@v4
        with:
          name: LeiwaundOS-Linux-v2.0
          path: dist/LeiwaundOS_v2.0_Linux
